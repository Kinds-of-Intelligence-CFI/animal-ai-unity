# Two agents whose episode only ends once both have finished (episodeEnd: all).
!ArenaConfig
arenas:
  0: !Arena
    passMark: 0
    timeLimit: 250
    episodeEnd: all
    items:
    - !Item
      name: Agent
      positions:
      - !Vector3 {x: 10, y: 0, z: 20}
      rotations: [0]
    - !Item
      name: Agent
      positions:
      - !Vector3 {x: 30, y: 0, z: 20}
      rotations: [0]
