# Agent zones: agent 1 spawns 3m from agent 0, inside its 5m zone. Used by AgentZoneTests.
!ArenaConfig
arenas:
  0: !Arena
    passMark: 0
    timeLimit: 250
    items:
    - !Item
      name: Agent
      positions:
      - !Vector3 {x: 10, y: 0, z: 20}
      rotations: [90]
      zone:
        radius: 5
        operations:
        - !grantContinuousReward
          rewardPerStep: 0.1
    - !Item
      name: Agent
      positions:
      - !Vector3 {x: 13, y: 0, z: 20}
      rotations: [270]
