# Agent zones are blocked by walls: agent 1 spawns 5m from agent 0, inside its 6m zone, but a wall
# stands between them. Used by AgentZoneTests.
!ArenaConfig
arenas:
  0: !Arena
    passMark: 0
    timeLimit: 250
    items:
    - !Item
      name: Agent
      positions:
      - !Vector3 {x: 10, y: 0, z: 20}
      rotations: [90]
      zone:
        radius: 6
        operations:
        - !grantContinuousReward
          rewardPerStep: 0.1
    - !Item
      name: Agent
      positions:
      - !Vector3 {x: 15, y: 0, z: 20}
      rotations: [270]
    - !Item
      name: Wall
      positions:
      - !Vector3 {x: 12.5, y: 0, z: 20}
      rotations: [0]
      sizes:
      - !Vector3 {x: 0.5, y: 3, z: 6}
      colors:
      - !RGB {r: 153, g: 153, b: 153}
