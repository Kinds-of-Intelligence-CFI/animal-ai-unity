# Agent zones: agent 0 carries a 3m zone that rewards any other agent inside it every step. Agent 1
# starts 20m away, facing it. Used by AgentZoneTests.
!ArenaConfig
arenas:
  0: !Arena
    passMark: 0
    timeLimit: 250
    items:
    - !Item
      name: Agent
      positions:
      - !Vector3 {x: 10, y: 0, z: 20}
      rotations: [90]
      zone:
        radius: 3
        triggerZoneID: mother
        operations:
        - !grantContinuousReward
          rewardPerStep: 0.1
    - !Item
      name: Agent
      positions:
      - !Vector3 {x: 30, y: 0, z: 20}
      rotations: [270]
