# Agent zones are blocked by goals, which are solid: agent 1 spawns 5m from agent 0, inside its 6m zone,
# with a GoodGoal on the line between them (touching neither). Used by AgentZoneTests.
!ArenaConfig
arenas:
  0: !Arena
    passMark: 0
    timeLimit: 250
    items:
    - !Item
      name: Agent
      positions:
      - !Vector3 {x: 10, y: 0, z: 20}
      rotations: [90]
      zone:
        radius: 6
        operations:
        - !grantContinuousReward
          rewardPerStep: 0.1
    - !Item
      name: Agent
      positions:
      - !Vector3 {x: 15, y: 0, z: 20}
      rotations: [270]
    - !Item
      name: GoodGoal
      positions:
      - !Vector3 {x: 12.5, y: 0, z: 20}
      sizes:
      - !Vector3 {x: 1, y: 1, z: 1}
